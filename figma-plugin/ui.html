<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 18px;
        font: 13px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #222;
        background: #fffaf2;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 14px;
        color: #62675f;
      }
      button {
        width: 100%;
        height: 40px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        background: #f06a20;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #ecefe5;
        color: #222;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      textarea {
        width: 100%;
        height: 310px;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 10px;
        border: 1px solid #d7dccf;
        border-radius: 10px;
        background: #fff;
        color: #222;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .status {
        margin-top: 12px;
        padding: 10px;
        border-radius: 10px;
        background: #ecefe5;
        color: #62675f;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>BBDC Token Exporter Demo</h1>
    <p>稳定版：只负责从当前 Figma 文件读取 button / motion/button 变量，并下载 token JSON。GitHub 同步先用本地脚本完成。</p>

    <button id="collect">1. 读取 Figma Variables 并生成 JSON</button>
    <button class="secondary" id="download" disabled>2. 下载 JSON</button>

    <textarea id="preview" readonly placeholder="导出的 JSON 会显示在这里"></textarea>
    <div id="status" class="status">等待导出。</div>

    <script>
      var tokenDocument = null;

      function $(id) {
        return document.getElementById(id);
      }
      function setStatus(text) {
        $("status").textContent = text;
      }
      function timestamp() {
        return new Date().toISOString().replace(/\.\d{3}Z$/, "Z").replace(/[:.]/g, "-");
      }

      $("collect").onclick = function () {
        setStatus("正在读取 Figma Variables...");
        parent.postMessage({ pluginMessage: { type: "collect-tokens" } }, "*");
      };

      $("download").onclick = function () {
        if (!tokenDocument) return;
        var blob = new Blob([JSON.stringify(tokenDocument, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "bbdc-token-export-" + timestamp() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      onmessage = function (event) {
        var message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "tokens-collected") {
          tokenDocument = message.document;
          $("preview").value = JSON.stringify(tokenDocument, null, 2);
          $("download").disabled = false;
          setStatus("导出完成：" + Object.keys(tokenDocument.tokens || {}).length + " 个 token。");
        }
        if (message.type === "error") {
          setStatus("导出失败：" + message.message);
        }
      };
    </script>
  </body>
</html>
